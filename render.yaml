services:
  - type: web
    name: newmarket-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node server/index.js
    rootDir: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
